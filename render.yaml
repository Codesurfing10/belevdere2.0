# Belvedere 2.0 — Render Blueprint for public demo
# After deploy: set MAPBOX / Stripe / PayPal env vars in the dashboard (sync: false below),
# then seed once: render shell → npm run db:seed
databases:
  - name: belevdere-db
    plan: free
    databaseName: belevdere
    user: belevdere

services:
  - type: web
    name: belevdere-web
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: belevdere-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      # Signs session/booking cookies (required in production)
      - key: SESSION_SECRET
        generateValue: true
      # Basic-auth password for /admin and /api/admin (admin disabled if unset)
      - key: ADMIN_PASSWORD
        sync: false
      # Set to "true" ONLY for the public demo (marks orders paid with no charge).
      # Unset in production: checkout fails safe (503) until real keys are set.
      - key: DEMO_MODE
        sync: false
      # Optional error reporting
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_MAPBOX_TOKEN
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_ME_URL
        sync: false
