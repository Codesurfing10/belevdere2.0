# Belvedere 2.0 — Render Blueprint for public demo
# After deploy: set MAPBOX / Stripe env vars in the dashboard (sync: false below),
# then seed once: render shell → npm run db:seed
databases:
  - name: belevdere-db
    plan: free
    databaseName: belevdere
    user: belevdere

services:
  - type: web
    name: belevdere-web
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: belevdere-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_MAPBOX_TOKEN
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
